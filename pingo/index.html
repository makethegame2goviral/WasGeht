<!doctype html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><meta name="description" content="PINGO – Chats, Gruppen und Momente mit deinen Leuten."><title>PINGO — Dein Kreis. Dein Chat.</title>
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{night:'#090b12',panel:'#111522',line:'#252b3b',lime:'#b9f56a',muted:'#9299aa'}}}}</script><link rel="stylesheet" href="./styles.css"></head>
<body class="bg-night text-white"><div class="app-shell">
<aside class="sidebar"><a class="brand" href="#"><span class="brand-mark">p</span><span>PINGO</span></a><div class="profile-mini"><div class="avatar self" id="sideAvatar">Y</div><div class="profile-copy"><strong id="sideName">Dein Profil</strong><span class="online-label"><i></i> Online</span></div><button class="icon-button" data-view="settings" aria-label="Einstellungen">•••</button></div>
<nav class="main-nav"><button class="nav-item active" data-view="messages"><span class="nav-icon">▤</span><span>Chats</span></button><button class="nav-item" data-view="groups"><span class="nav-icon">♧</span><span>Gruppen</span></button><button class="nav-item" data-view="moments"><span class="nav-icon">◉</span><span>Moments</span></button><button class="nav-item" data-view="contacts"><span class="nav-icon">♙</span><span>Kontakte</span></button></nav>
<div class="sidebar-bottom"><button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>Einstellungen</span></button><div class="sidebar-foot">PINGO <span>PREVIEW</span></div></div></aside>
<main class="workspace"><section class="inbox-panel" id="inboxPanel"><header class="panel-header"><div><p class="eyebrow">DEIN KREIS</p><h1 id="panelTitle">Nachrichten</h1></div><button class="round-action" id="newChatBtn" aria-label="Neuen Chat starten">＋</button></header><label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="Chats und Kontakte suchen…" autocomplete="off"></label><div class="list-heading"><span id="listHeading">LETZTE CHATS</span><button id="filterBtn">Alle⌄</button></div><div class="chat-list" id="chatList"></div><div class="mobile-nav"><button class="active" data-view="messages">▤<small>Chats</small></button><button data-view="groups">♧<small>Gruppen</small></button><button data-view="moments">◉<small>Moments</small></button><button data-view="contacts">♙<small>Kontakte</small></button></div></section>
<section class="content-panel"><header class="content-topbar"><div class="breadcrumb"><span>PINGO</span><b>/</b><span id="crumb">Nachrichten</span></div><div class="top-actions"><span class="connection"><i></i> Vorschau</span><div class="avatar self small-avatar" id="topAvatar">Y</div></div></header><div class="view-container" id="viewContainer"></div></section></main></div>
<div class="call-overlay hidden" id="callOverlay" role="dialog" aria-modal="true" aria-label="Videoanruf"><header class="call-top"><div><p class="eyebrow">PINGO VIDEO</p><h2 id="callTitle">Videoanruf</h2><p id="callStatus">Kamera wird vorbereitet…</p></div><button class="icon-button call-close" id="closeCall" aria-label="Anruf schließen">×</button></header><div class="call-stage"><div class="remote-placeholder" id="remotePlaceholder"><div class="remote-avatar" id="remoteAvatar">M</div><strong id="remoteName">Kontakt</strong><span>Warte auf Verbindung…</span></div><video id="remoteVideo" autoplay playsinline class="hidden"></video><video id="localVideo" autoplay muted playsinline></video></div><div class="call-controls"><button id="micBtn" class="call-control" aria-label="Mikrofon ausschalten" title="Mikrofon">🎙</button><button id="cameraBtn" class="call-control" aria-label="Kamera ausschalten" title="Kamera">▣</button><button id="flipBtn" class="call-control" aria-label="Kamera wechseln" title="Vorder-/Rückkamera">↻</button><button id="hangBtn" class="call-control hang" aria-label="Auflegen" title="Auflegen">☎</button></div><p class="call-note" id="callNote">Kamera und Mikrofon starten nur nach deiner Zustimmung.</p></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script src="./app.js" defer></script></body></html>
